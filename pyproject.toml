[project]
name = "skimmer"
version = "0.1.0"
description = "GTK4 music manager for the Innioasis Y1"
requires-python = ">=3.11"
dependencies = [
  "PyGObject>=3.42.0",
  "ytmusicapi>=1.0.0",
  "yt-dlp>=2023.0.0",
  "beets>=2.0.0",
  "mpris-server>=0.8.1",
  "platformdirs>=4.0.0",
  "spotifyscraper>=3.9.0",
  "Pillow>=10.0.0",
  "pyobjc-framework-MediaPlayer>=10.0; platform_system == 'Darwin'",
  "pyobjc-framework-Cocoa>=10.0; platform_system == 'Darwin'",
]

[project.scripts]
skimmer = "skimmer.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:gi\\.",
]

[tool.setuptools.packages.find]
include = ["skimmer*"]
exclude = [".flatpak-builder*", "build-dir*"]

[dependency-groups]
dev = [
  "pyinstaller>=6.21.0",
  "pytest>=7.0",
  "ruff>=0.9.0",
  "pyright>=1.1.380",
  "PyGObject-stubs>=2.17.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["skimmer", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"skimmer/gtk.py" = ["E402"]
"skimmer/gst.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["skimmer"]
